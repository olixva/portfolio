<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
html,body{margin:0;padding:0}
body{width:1200px;height:630px;background:#111210;color:#f1f2e9;
  font-family:'DM Sans',Arial,sans-serif;display:flex;flex-direction:column;
  justify-content:space-between;padding:64px 72px;box-sizing:border-box;overflow:hidden;position:relative}
.glow{position:absolute;right:-160px;top:-160px;width:720px;height:720px;border-radius:50%;
  background:radial-gradient(circle,#dcff5426,#dcff5400 62%)}
.top{display:flex;align-items:center;gap:0;font-size:44px;font-weight:700;letter-spacing:-4px;line-height:1}
.top i{font-style:normal;color:#dcff54}
.mark{display:inline-block}
.eyebrow{font-size:19px;letter-spacing:.24em;text-transform:uppercase;color:#9c9f94;margin-left:auto;letter-spacing:.22em}
h1{font-size:96px;line-height:.98;letter-spacing:-.055em;margin:0;font-weight:500;max-width:15ch}
h1 em{font-style:normal;color:#dcff54}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
.foot p{margin:0;font-size:25px;color:#c9cec0;max-width:22ch;line-height:1.35}
.tags{display:flex;gap:12px}
.tags span{border:1px solid #ffffff2e;border-radius:100px;padding:11px 22px;font-size:19px;color:#d5d8cc}
.rule{position:absolute;left:0;right:0;bottom:0;height:8px;background:#dcff54}
</style></head><body>
<div class="glow"></div>
<div class="top"><span class="mark">ao<i>/</i></span><span class="eyebrow">Portfolio</span></div>
<h1>Ingeniería.<br>Inteligencia.<br><em>Impacto.</em></h1>
<div class="foot">
  <p><strong>Antonio Oliva Cárceles</strong><br>Senior AI Engineer · Allianz</p>
  <div class="tags"><span>Agentes</span><span>RAG</span><span>LLMs</span><span>Cloud</span></div>
</div>
<div class="rule"></div>
</body></html>
